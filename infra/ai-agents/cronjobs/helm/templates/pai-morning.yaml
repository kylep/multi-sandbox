apiVersion: batch/v1
kind: CronJob
metadata:
  name: pai-morning
  namespace: ai-agents
spec:
  schedule: {{ .Values.cronjobs.paiMorning.schedule | quote }}
  timeZone: "UTC"
  # 24h deadline so a scheduled run still fires after the rancher-desktop
  # VM resumes from laptop sleep. Safe because at most 1 run/day is missed.
  startingDeadlineSeconds: 86400
  suspend: {{ not .Values.cronjobs.paiMorning.enabled }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          annotations:
            vault.hashicorp.com/agent-inject: "true"
            vault.hashicorp.com/role: "ai-agents"
            # Pai bot token + Claude OAuth. Also reads discord_guild_id from
            # secret/ai-agents/discord since guild ID is shared across bots.
            vault.hashicorp.com/agent-inject-secret-config: "secret/ai-agents/pai"
            vault.hashicorp.com/agent-inject-template-config: |
              {{`{{- with secret "secret/ai-agents/pai" }}`}}
              export DISCORD_BOT_TOKEN="{{`{{ .Data.data.discord_bot_token }}`}}"
              export CLAUDE_CODE_OAUTH_TOKEN="{{`{{ .Data.data.claude_oauth_token }}`}}"
              export LINEAR_API_KEY="{{`{{ .Data.data.linear_api_key }}`}}"
              {{`{{ end }}`}}
              {{`{{- with secret "secret/ai-agents/discord" }}`}}
              export DISCORD_GUILD_ID="{{`{{ .Data.data.discord_guild_id }}`}}"
              {{`{{ end }}`}}
        spec:
          serviceAccountName: cronjob-agent
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: agent
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  . /vault/secrets/config

                  # MCP server is named "pai-discord" to match mcp__pai-discord__* tool names.
                  # DISCORD_BOT_TOKEN (from Vault pai secret) is the Pai bot token.
                  printf '%s' '{"mcpServers":{"pai-discord":{"type":"stdio","command":"python3","args":["/workspace/repo/apps/mcp-servers/discord/server.py"]}}}' \
                    > /tmp/mcp.json

                  # Clone public repo so claude can find the pai agent definition.
                  git clone https://github.com/kylep/multi.git /workspace/repo
                  cd /workspace/repo

                  # Pre-flight: verify MCP server deps and env before launching Claude.
                  if [ -z "$DISCORD_BOT_TOKEN" ]; then echo "MCP preflight FAILED: DISCORD_BOT_TOKEN not set" >&2; exit 1; fi
                  python3 -c "import httpx, mcp.server.fastmcp" || { echo "MCP preflight FAILED: python import error" >&2; exit 1; }
                  echo "MCP preflight OK" >&2

                  claude --agent pai \
                    -p "Post one message to #general: a creative, fun morning greeting. @mention <@293425741406928906> (penegy/Kara) in the message. Be creative and non-repetitive. Some ideas (pick one, or do something entirely different): a short joke or pun, something about today's date (holidays, historical events, fun facts, pop culture references like May 4th = Star Wars day), a tiny poem or haiku, a playful motivational one-liner. Keep it to 1-3 sentences. Cute, warm, fun. No emojis. Read the last 10 messages of #general first so you don't repeat yourself." \
                    --mcp-config /tmp/mcp.json \
                    --allowedTools "WebSearch,WebFetch,mcp__pai-discord__send_message,mcp__pai-discord__list_channels,mcp__pai-discord__read_messages" \
                    --verbose \
                    --output-format stream-json
              resources:
                requests:
                  cpu: 1m
                  memory: 256Mi
                limits:
                  cpu: 200m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
          volumes:
            - name: workspace
              emptyDir: {}
